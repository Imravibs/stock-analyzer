version: '3.8'

services:
  stock-analyzer:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped